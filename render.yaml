services:
  - type: web
    name: yeeyoo-backend
    runtime: node
    # Both region lines in this file named frankfurt while the live service and
    # the live database are in oregon, so the file described infrastructure
    # that does not exist. Text only - nothing is applied or moved by this.
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # Server
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://app.yeeyoo.no
      - key: BACKEND_URL
        value: https://yeeyoo-backend.onrender.com

      # Database (auto-linked)
      - key: DATABASE_URL
        fromDatabase:
          name: yeeyoo-db
          property: connectionString

      # Auth
      - key: JWT_SECRET
        generateValue: true

      # Token-kryptering (AES-256-GCM). MÅ være stabil — 64 hex-tegn (32 bytes).
      # ALDRI generateValue her: endret nøkkel gjør krypterte tokens uleselige.
      - key: META_TOKEN_ENCRYPTION_KEY
        sync: false

      # Google OAuth2
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://yeeyoo-backend.onrender.com/api/auth/google/callback

      # Vipps Login
      - key: VIPPS_CLIENT_ID
        sync: false
      - key: VIPPS_CLIENT_SECRET
        sync: false
      - key: VIPPS_SUBSCRIPTION_KEY
        sync: false
      - key: VIPPS_MSN
        sync: false
      - key: VIPPS_REDIRECT_URI
        value: https://yeeyoo-backend.onrender.com/api/auth/vipps/callback

      # Email (SendGrid)
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        value: no-reply@yeeyoo.no

      # Image Generation (FLUX 1.1 Pro via fal.ai)
      - key: FAL_KEY
        sync: false

      # AI Models
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_VEKST
        sync: false
      - key: STRIPE_PRICE_BEDRIFT
        sync: false

      # Social OAuth (publishing)
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false

      # OAuth-redirect-flyt (LinkedIn bruker LINKEDIN_* over)
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: yeeyoo-saas/1.0
      - key: PINTEREST_CLIENT_ID
        sync: false
      - key: PINTEREST_CLIENT_SECRET
        sync: false

databases:
  - name: yeeyoo-db
    # Same correction as the service above: the live database is in oregon.
    region: oregon
    plan: starter
